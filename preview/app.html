<body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-secondary-container">
  <div id="root">
    <!-- 로딩 스피너 (React 마운트 전 표시) -->
    <div id="app-loading-indicator" class="flex flex-col items-center justify-center min-h-screen gap-3 text-on-surface-variant">
      <div class="w-10 h-10 border-4 border-secondary/30 border-t-secondary rounded-full animate-spin"></div>
      <p class="font-label-md text-label-md text-primary font-bold">쓸고딱고 모바일 앱 실행 중...</p>
    </div>
  </div>

  <!-- Global Error Logger & Fallback Display -->
  <script>
    window.addEventListener('error', function(e) {
      console.error('🔥 [App Global Error]', e.error || e.message);
      const root = document.getElementById('root');
      if (root && (!root.children || root.children[0]?.id === 'app-loading-indicator')) {
        root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#ba1a1a;background:#faf8ff;min-height:100vh;">' +
          '<h3 style="font-size:18px;font-weight:bold;margin-bottom:8px;">⚠️ 화면 렌더링 중 오류가 발생했습니다.</h3>' +
          '<pre style="background:#ffdad6;color:#93000a;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;">' +
          (e.error ? (e.error.stack || e.error.message) : e.message) + '</pre>' +
          '<button onclick="location.reload()" style="margin-top:16px;padding:10px 16px;background:#003262;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">페이지 새로고침</button>' +
          '</div>';
      }
    });
  </script>

  <!-- Capacitor Mock / Bridge Initialization for Web Preview -->
  <script>
    if (!window.Capacitor) {
      window.Capacitor = {
        isNativePlatform: () => false,
        getPlatform: () => 'web',
        Plugins: {
          Haptics: {
            impact: async (options) => {
              console.log('📱 [Haptics Impact]', options);
            },
            notification: async (options) => {
              console.log('📱 [Haptics Notification]', options);
            }
          },
          StatusBar: {
            setStyle: async (options) => {
              console.log('📱 [StatusBar]', options);
            }
          },
          App: {
            addListener: (event, handler) => {
              console.log('📱 [Capacitor App Listener]', event);
              return { remove: () => {} };
            }
          }
        }
      };
    }
  </script>

  <!-- Daum / Kakao Postcode SDK -->
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

  <!-- React 18 CDN with Fallback -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Dynamic Cache-Busting Script Loader for Hot Updates -->
  <script>
    (function() {
      const v = Date.now();
      function loadScript(src, callback) {
        const s = document.createElement('script');
        s.src = src + '?t=' + v;
        s.async = false;
        s.onload = () => {
          console.log('✅ Loaded:', src);
          if (callback) callback();
        };
        s.onerror = (e) => {
          console.error('❌ Failed to load script:', src, e);
        };
        document.body.appendChild(s);
      }

      loadScript('/app_clnt_req_000.js', () => {
        loadScript('/app_clnt_ath_000.js', () => {
          loadScript('/app_clnt_ath_010.js', () => {
            loadScript('/app_clnt_ath_011.js', () => {
              loadScript('/app_clnt_com_000.js');
            });
          });
        });
      });
    })();
  </script>
