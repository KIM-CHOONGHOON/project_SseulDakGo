const { useState, useEffect, useCallback, useMemo, useRef } = React;

/**

 * 화면 ID: APP-CLNT-MYP-020100
 * 한글 화면명: 시공사 파트너 입점 서류 및 전문 자격/수료증 등록
 * 파일 경로: SseulDakGo_App/Client/screens/APP-CLNT-MYP-020100/index.tsx
 * 아키텍처: Capacitor / WebView 껍데기 앱 내 패키징되는 모바일 최적화 React 컴포넌트

 * ============================================================================
 */

// Capacitor / Webview Native Bridge 인터페이스 선언

) => Promise<void>;
          notification?: (options: { type: 'SUCCESS' | 'WARNING' | 'ERROR' }) => Promise<void>;
        };
      };
    };
  }
}

/**
 * 모바일 햅틱 피드백 트리거
 */
const triggerHaptic = (style = 'LIGHT') => {
  try {
    if (typeof window !== 'undefined') {
      if (style === 'SUCCESS') {
        if (window.Capacitor?.Plugins?.Haptics?.notification) {
          window.Capacitor.Plugins.Haptics.notification({ type: 'SUCCESS' }).catch(() => {});
          return;
        }
        if ('vibrate' in navigator && typeof navigator.vibrate === 'function') {
          navigator.vibrate([15, 50, 20]);
          return;
        }
      }
      if (window.Capacitor?.Plugins?.Haptics?.impact) {
        window.Capacitor.Plugins.Haptics.impact({ style: style }).catch(() => {});
        return;
      }
      if ('vibrate' in navigator && typeof navigator.vibrate === 'function') {
        navigator.vibrate(style === 'HEAVY' ? 30 : 15);
      }
    }
  } catch (_) {}
};



function AppClntMyp020100({
  srvcNo = 'S20261100001',
  onBack,
  onSkip,
  onComplete,
  onNavigate,
}) {
  // 1. 상태 관리
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);

  const [serviceInfo, setServiceInfo] = useState({
    srvcNo: 'S20261100001',
    companyNm: '공간다원 (클린앤케어)',
    bizNo: '120-88-29401',
    userName: '김충훈',
    mainCleanLargeCd: 'APPLIANCE',
    bizVerifiedYn: 'Y',
  });

  const [activeBadges, setActiveBadges] = useState([]);
  const [commonCodes, setCommonCodes] = useState({
    docTypes: [],
    badgeTypes: [],
    certMasterList: [],
  });

  const [certifications, setCertifications] = useState([]);

  // 바텀 시트 (자격증 종목 선택용)
  const [bottomSheetIndex, setBottomSheetIndex] = useState(null);

  // 파일 미리보기 모달
  const [previewModal, setPreviewModal] = useState({
    open: false,
    url: '',
    name: '',
    ext: '',
  });

  // 토스트 메시지
  const [toast, setToast] = useState({
    show: false,
    message: '',
    type: 'info',
  });

  const cameraInputRefs = useRef({});
  const albumInputRefs = useRef({});
  const fileInputRefs = useRef({});

  const showToast = useCallback((message, type = 'info') => {
    setToast({ show: true, message, type });
    setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 2800);
  }, []);

  // 2. 초기 데이터 로드
  const fetchData = useCallback(async () => {
    setLoading(true);
    try {
      // 1) 공통 코드 조회
      const codeRes = await fetch(`/api/app/client/myp_020100`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'GET_COMMON_CODES', srvcNo, mainServiceCat: 'APPLIANCE' }),
      });
      const codeJson = await codeRes.json();
      if (codeJson.success && codeJson.data) {
        setCommonCodes({
          docTypes: codeJson.data.docTypes || [],
          badgeTypes: codeJson.data.badgeTypes || [],
          certMasterList: codeJson.data.certMasterList || [],
        });
      }

      // 2) 자격 서류 목록 조회
      const certRes = await fetch(`/api/app/client/myp_020100`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'GET_CERTIFICATIONS', srvcNo }),
      });
      const certJson = await certRes.json();
      if (certJson.success && certJson.data) {
        setServiceInfo({
          srvcNo: certJson.data.srvcNo || srvcNo,
          companyNm: certJson.data.companyNm || '공간다원 (클린앤케어)',
          bizNo: certJson.data.bizNo || '120-88-29401',
          userName: certJson.data.userName || '김충훈',
          mainCleanLargeCd: certJson.data.mainCleanLargeCd || 'APPLIANCE',
          bizVerifiedYn: certJson.data.bizVerifiedYn || 'Y',
        });
        setActiveBadges(certJson.data.badges || []);

        const initialList = certJson.data.certifications || [];
        if (initialList.length === 0) {
          setCertifications([
            {
              certSeq: null,
              tempId: Date.now(),
              docType: 'LICENSE',
              certCode: 'CERT_SYS_AC',
              customCertName: '',
              issuerName: '한국시스템에어컨유지보수관리협회(KSAMA)',
              issuedDate: '2024. 06',
              storagePath: '/storage/project/brand/Logo_쓸고딱고.jpg',
              fileUrl: '/storage/project/brand/Logo_쓸고딱고.jpg',
              fileName: 'KSAMA_시스템에어컨세척관리사_자격증.pdf',
              fileExt: 'pdf',
              fileSize: 2457600,
              privacyMaskYn: 'Y',
              reviewStatus: 'APPROVED',
              reviewDate: '2024.06.18',
            },
            {
              certSeq: null,
              tempId: Date.now() + 1,
              docType: 'COMPLETION',
              certCode: 'ETC_DIRECT_INPUT',
              customCertName: '친환경 오존/피톤치드 공간 살균 방역 실무 마스터과정',
              issuerName: '사단법인 한국실내환경방역협회',
              issuedDate: '2025. 02',
              storagePath: '/storage/project/brand/Logo_쓸고딱고.jpg',
              fileUrl: '/storage/project/brand/Logo_쓸고딱고.jpg',
              fileName: '방역살균수료증_공간다원.jpg',
              fileExt: 'jpg',
              fileSize: 4299161,
              privacyMaskYn: 'Y',
              reviewStatus: 'PENDING',
              reviewDate: '2026.11.20',
            },
            {
              certSeq: null,
              tempId: Date.now() + 2,
              docType: 'CAREER',
              certCode: 'CAR_MAKER_SVC',
              customCertName: '',
              issuerName: '삼성전자서비스(주) 중부지사 CS팀',
              issuedDate: '2023. 08',
              storagePath: '',
              fileUrl: '',
              fileName: '',
              fileExt: '',
              fileSize: 0,
              privacyMaskYn: 'N',
              reviewStatus: 'DRAFT',
              reviewDate: null,
            },
          ]);
        } else {
          setCertifications(
            initialList.map((item) => ({
              ...item,
              tempId: item.certSeq,
            }))
          );
        }
      }
    } catch (err) {
      console.error('모바일 데이터 로드 실패:', err);
      showToast('서버 데이터 로드 중 오류가 발생했습니다.', 'error');
    } finally {
      setLoading(false);
    }
  }, [srvcNo, showToast]);

  useEffect(() => {
    fetchData();
  }, [fetchData]);

  // 항목 추가 (최대 5건)
  const handleAddCard = () => {
    triggerHaptic('LIGHT');
    if (certifications.length >= 5) {
      showToast('자격증/수료증은 최대 5건까지만 등록 가능합니다.', 'error');
      return;
    }
    const newCard = {
      certSeq: null,
      tempId: Date.now() + Math.random(),
      docType: 'CAREER',
      certCode: 'CAR_MAKER_SVC',
      customCertName: '',
      issuerName: '',
      issuedDate: new Date().toISOString().slice(0, 7).replace('-', '. '),
      storagePath: '',
      fileUrl: '',
      fileName: '',
      fileExt: '',
      fileSize: 0,
      privacyMaskYn: 'N',
      reviewStatus: 'DRAFT',
      rejectReason: null,
    };
    setCertifications((prev) => [...prev, newCard]);
  };

  // 항목 삭제
  const handleDeleteCard = (index) => {
    triggerHaptic('MEDIUM');
    if (window.confirm(`항목 #${index + 1}을(를) 삭제하시겠습니까?`)) {
      setCertifications((prev) => prev.filter((_, idx) => idx !== index));
      showToast(`항목 #${index + 1}이(가) 삭제되었습니다.`, 'info');
    }
  };

  // 필드 변경
  const handleFieldChange = (index, field, value) => {
    setCertifications((prev) => {
      const updated = [...prev];
      const target = { ...updated[index], [field]: value };

      if (field === 'docType') {
        triggerHaptic('LIGHT');
        const matches = commonCodes.certMasterList.filter((c) => c.ATTR_VAL1 === value);
        if (matches.length > 0) {
          target.certCode = matches[0].COM_CD;
        } else {
          target.certCode = 'ETC_DIRECT_INPUT';
        }
      }

      if (field === 'certCode' && value !== 'ETC_DIRECT_INPUT') {
        target.customCertName = '';
      }

      updated[index] = target;
      return updated;
    });
  };

  // 모바일 파일 업로드
  const handleFileUpload = async (index, file) => {
    if (!file) return;

    if (file.size > 10 * 1024 * 1024) {
      showToast('파일 용량은 최대 10MB까지만 업로드 가능합니다.', 'error');
      return;
    }

    const ext = file.name.split('.').pop()?.toLowerCase() || 'jpg';
    if (!['jpg', 'jpeg', 'png', 'pdf'].includes(ext)) {
      showToast('JPG, PNG, PDF 형식의 파일만 지원됩니다.', 'error');
      return;
    }

    triggerHaptic('LIGHT');
    showToast('파일 업로드 중...', 'info');

    try {
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64Data = e.target?.result as string;
        const res = await fetch(`/api/app/client/myp_020100`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'UPLOAD_CERT_FILE',
            srvcNo,
            fileData: base64Data,
            fileName: file.name,
            mimeType: file.type,
            fileSize: file.size,
          }),
        });
        const json = await res.json();
        if (json.success && json.data) {
          triggerHaptic('SUCCESS');
          setCertifications((prev) => {
            const updated = [...prev];
            updated[index] = {
              ...updated[index],
              storagePath: json.data.storagePath,
              fileUrl: json.data.fileUrl,
              fileName: json.data.logicalFileNm,
              fileExt: json.data.fileExt,
              fileSize: json.data.fileSizeByte,
            };
            return updated;
          });
          showToast(`파일 업로드 완료: ${file.name}`, 'success');
        } else {
          showToast(json.message || '파일 업로드 실패', 'error');
        }
      };
      reader.readAsDataURL(file);
    } catch (err) {
      console.error('파일 업로드 오류:', err);
      showToast('파일 업로드 처리 중 오류가 발생했습니다.', 'error');
    }
  };

  // 저장 및 심사 요청
  const handleSubmit = async () => {
    triggerHaptic('MEDIUM');

    for (let i = 0; i < certifications.length; i++) {
      const item = certifications[i];
      if (item.certCode === 'ETC_DIRECT_INPUT' && !item.customCertName?.trim()) {
        showToast(`항목 #${i + 1}의 직접 입력 과정명을 입력해주세요.`, 'error');
        return;
      }
      if (!item.issuerName?.trim()) {
        showToast(`항목 #${i + 1}의 발급기관 또는 회사명을 입력해주세요.`, 'error');
        return;
      }
      if (item.privacyMaskYn !== 'Y') {
        showToast(`개인정보 보호를 위해 항목 #${i + 1}의 주민등록번호 마스킹 확인에 체크해주세요.`, 'error');
        return;
      }
    }

    setSaving(true);
    try {
      const payload = {
        action: 'SAVE_CERTIFICATIONS',
        srvcNo,
        certifications: certifications.map((c) => ({
          certSeq: c.certSeq,
          docType: c.docType,
          certCode: c.certCode,
          customCertName: c.certCode === 'ETC_DIRECT_INPUT' ? c.customCertName : null,
          issuerName: c.issuerName,
          issuedDate: c.issuedDate ? c.issuedDate.replace('. ', '-') : null,
          storagePath: c.storagePath,
          fileUrl: c.fileUrl,
          fileName: c.fileName,
          privacyMaskYn: c.privacyMaskYn,
        })),
      };

      const res = await fetch(`/api/app/client/myp_020100`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const json = await res.json();
      if (json.success) {
        triggerHaptic('SUCCESS');
        showToast('자격 및 경력 서류가 안전하게 제출되었습니다!', 'success');
        await fetchData();
        if (onComplete) onComplete();
      } else {
        showToast(json.message || '저장 중 오류가 발생했습니다.', 'error');
      }
    } catch (err) {
      console.error('제출 에러:', err);
      showToast('서버 통신 중 오류가 발생했습니다.', 'error');
    } finally {
      setSaving(false);
    }
  };

  // 자격증명 조회 헬퍼
  const getCertDisplayName = (certCode, customCertName) => {
    if (certCode === 'ETC_DIRECT_INPUT') {
      return customCertName || '기타 자격/수료증 직접 입력';
    }
    const match = commonCodes.certMasterList.find((c) => c.COM_CD === certCode);
    return match ? match.COM_NM : certCode;
  };

  return (
    <div className="bg-surface font-body-md text-on-surface flex flex-col min-h-screen antialiased select-none">
      {/* ==================================================================== */}
      {/* 1. 모바일 앱 고정 헤더 */}

                </div>
              );
            })}
          </div>

          {/* Add Item Button */}
          {certifications.length < 5 && (
            <section className="px-margin-mobile pt-space-md">
              <button
                className="w-full py-3.5 px-space-md rounded-xl bg-surface-container-lowest hover:bg-surface-container shadow-sm flex items-center justify-center gap-space-xs text-primary transition-colors border border-surface-container-high"
                type="button"
                onClick={handleAddCard}
              >
                <span className="material-symbols-outlined text-[20px]">add_circle</span>
                <span className="font-title-md text-title-md font-bold">
                  자격/수료증 추가하기 (현재 {certifications.length}건 / 최대 5건)
                </span>
              </button>
            </section>
          )}

          {/* Sticky Fixed Bottom Interaction Bar */}
          <div className="fixed bottom-0 inset-x-0 z-40 bg-surface-container-lowest/95 backdrop-blur-md shadow-[0_-4px_20px_rgba(0,0,0,0.06)] pb-safe border-t border-surface-container-low">
            <div className="max-w-[480px] mx-auto px-margin-mobile pt-space-sm pb-space-sm flex flex-col gap-2">
              <div className="flex items-center gap-space-xs">
                <button
                  className="flex-1 h-12 rounded-lg bg-surface-container text-on-surface font-title-md text-title-md font-bold flex items-center justify-center hover:bg-surface-container-high transition-colors"
                  type="button"
                  onClick={() => {
                    triggerHaptic('LIGHT');
                    if (onSkip) onSkip();
                    else if (onComplete) onComplete();
                  }}
                >
                  건너뛰기
                </button>

                <button
                  className="flex-[2] h-12 rounded-lg bg-primary-container text-on-primary font-title-md text-title-md font-bold flex items-center justify-center gap-1.5 shadow-md active:scale-[0.99] transition-transform disabled:opacity-50"
                  type="button"
                  disabled={saving}
                  onClick={handleSubmit}
                >
                  {saving ? (
                    <>
                      <span className="material-symbols-outlined animate-spin text-[20px]">sync</span>
                      <span>심사 전송중...</span>
                    </>
                  ) : (
                    <>
                      <span>저장 및 심사 요청</span>
                      <span className="material-symbols-outlined text-[18px]">arrow_forward</span>
                    </>
                  )}
                </button>
              </div>

              <p className="font-body-sm text-[11px] text-center text-outline">
                ※ 제출된 서류는 영업일 기준 1~2일 내 파트너 심사팀이 직접 진위 여부를 검증합니다.
              </p>
            </div>
          </div>
        </div>
      </main>

      {/* ==================================================================== */}
      {/* 3. 모바일 바텀 시트 (자격증 종목 선택) */}
      {/* ==================================================================== */}
      {bottomSheetIndex !== null && (
        <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60 animate-fadeIn">
          <div
            className="fixed inset-0"
            onClick={() => setBottomSheetIndex(null)}
          ></div>
          <div className="bg-surface-container-lowest rounded-t-2xl max-w-[480px] w-full p-space-md shadow-2xl relative z-10 animate-slideUp max-h-[80vh] flex flex-col pb-safe">
            <div className="w-12 h-1.5 bg-surface-container-highest rounded-full mx-auto mb-3"></div>

            <div className="flex items-center justify-between pb-3 border-b border-surface-container-low mb-2">
              <h3 className="font-title-md text-title-md font-bold text-on-surface">자격 / 수료 종목 선택</h3>
              <button
                className="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container"
                onClick={() => setBottomSheetIndex(null)}
              >
                <span className="material-symbols-outlined text-[20px]">close</span>
              </button>
            </div>

            <div className="overflow-y-auto space-y-2 py-2 flex-1">
              <p className="font-label-sm text-label-sm text-secondary font-bold px-2">
                [추천] 가전 분해 세척 (APPLIANCE)
              </p>
              {commonCodes.certMasterList
                .filter((c) => c.PARENT_COM_CD === 'APPLIANCE')
                .map((c) => (
                  <button
                    key={c.COM_CD}
                    type="button"
                    className="w-full text-left p-3 rounded-xl bg-surface-container-low hover:bg-primary-fixed/40 transition-colors flex items-center justify-between"
                    onClick={() => {
                      triggerHaptic('LIGHT');
                      handleFieldChange(bottomSheetIndex, 'certCode', c.COM_CD);
                      setBottomSheetIndex(null);
                    }}
                  >
                    <div className="flex flex-col">
                      <span className="font-title-md text-body-md font-semibold text-on-surface">{c.COM_NM}</span>
                      <span className="font-label-sm text-label-sm text-on-surface-variant">{c.ATTR_VAL2 || c.COM_CD}</span>
                    </div>
                    <span className="material-symbols-outlined text-outline text-[18px]">chevron_right</span>
                  </button>
                ))}

              <p className="font-label-sm text-label-sm text-primary font-bold px-2 pt-2">
                공간 청소 및 방역 (MOVE_IN)
              </p>
              {commonCodes.certMasterList
                .filter((c) => c.PARENT_COM_CD === 'MOVE_IN')
                .map((c) => (
                  <button
                    key={c.COM_CD}
                    type="button"
                    className="w-full text-left p-3 rounded-xl bg-surface-container-low hover:bg-primary-fixed/40 transition-colors flex items-center justify-between"
                    onClick={() => {
                      triggerHaptic('LIGHT');
                      handleFieldChange(bottomSheetIndex, 'certCode', c.COM_CD);
                      setBottomSheetIndex(null);
                    }}
                  >
                    <div className="flex flex-col">
                      <span className="font-title-md text-body-md font-semibold text-on-surface">{c.COM_NM}</span>
                      <span className="font-label-sm text-label-sm text-on-surface-variant">{c.ATTR_VAL2 || c.COM_CD}</span>
                    </div>
                    <span className="material-symbols-outlined text-outline text-[18px]">chevron_right</span>
                  </button>
                ))}

              <p className="font-label-sm text-label-sm text-outline font-bold px-2 pt-2">기타 직접 입력</p>
              <button
                type="button"
                className="w-full text-left p-3 rounded-xl bg-surface-container-low hover:bg-primary-fixed/40 transition-colors flex items-center justify-between"
                onClick={() => {
                  triggerHaptic('LIGHT');
                  handleFieldChange(bottomSheetIndex, 'certCode', 'ETC_DIRECT_INPUT');
                  setBottomSheetIndex(null);
                }}
              >
                <div className="flex flex-col">
                  <span className="font-title-md text-body-md font-semibold text-on-surface">기타 자격/수료증 직접 입력</span>
                  <span className="font-label-sm text-label-sm text-on-surface-variant">자격증 또는 수료 과정명을 직접 기재</span>
                </div>
                <span className="material-symbols-outlined text-outline text-[18px]">edit</span>
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ==================================================================== */}
      {/* 4. 파일 원본 미리보기 모달 */}
      {/* ==================================================================== */}
      {previewModal.open && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4 animate-fadeIn">
          <div className="bg-surface-container-lowest rounded-2xl max-w-sm w-full p-4 shadow-xl relative animate-scaleUp flex flex-col">
            <div className="flex items-center justify-between pb-2 border-b border-surface-container-low mb-3">
              <span className="font-title-md text-title-md font-bold text-on-surface truncate">{previewModal.name}</span>
              <button
                className="w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant"
                onClick={() => setPreviewModal({ open: false, url: '', name: '', ext: '' })}
              >
                <span className="material-symbols-outlined text-[20px]">close</span>
              </button>
            </div>

            <div className="min-h-[220px] max-h-[400px] overflow-auto flex items-center justify-center bg-surface-container-low rounded-xl p-2">
              {previewModal.ext === 'pdf' ? (
                <div className="flex flex-col items-center justify-center text-center p-4 space-y-2">
                  <span className="material-symbols-outlined text-primary text-[48px]">picture_as_pdf</span>
                  <p className="font-label-md text-label-md font-semibold text-on-surface">{previewModal.name}</p>
                  <a
                    href={previewModal.url}
                    target="_blank"
                    rel="noreferrer"
                    className="px-3 py-1.5 bg-primary text-on-primary rounded-lg font-label-sm text-label-sm font-semibold inline-flex items-center gap-1 shadow-sm"
                  >
                    <span>새 창에서 원본 열기</span>
                    <span className="material-symbols-outlined text-[14px]">open_in_new</span>
                  </a>
                </div>
              ) : (
                <img
                  src={previewModal.url}
                  alt={previewModal.name}
                  className="max-h-[360px] object-contain rounded-lg"
                  onError={(e) => {
                    e.currentTarget.src = '/storage/project/brand/Logo_쓸고딱고.jpg';
                  }}
                />
              )}
            </div>

            <button
              className="mt-3 w-full py-2.5 bg-surface-container hover:bg-surface-container-high text-on-surface rounded-lg font-label-md font-semibold"
              onClick={() => setPreviewModal({ open: false, url: '', name: '', ext: '' })}
            >
              닫기
            </button>
          </div>
        </div>
      )}

      {/* ==================================================================== */}
      {/* 5. 모바일 플로팅 토스트 */}
      {/* ==================================================================== */}
      {toast.show && (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-[380px] animate-bounce">
          <div
            className={`px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 text-on-primary font-label-md text-label-md ${
              toast.type === 'error'
                ? 'bg-error text-on-error'
                : toast.type === 'success'
                ? 'bg-secondary text-on-secondary'
                : 'bg-inverse-surface text-inverse-on-surface'
            }`}
          >
            <span className="material-symbols-outlined text-[18px]">
              {toast.type === 'error' ? 'error' : toast.type === 'success' ? 'check_circle' : 'info'}
            </span>
            <span className="truncate">{toast.message}</span>
          </div>
        </div>
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppClntMyp020100
        srvcNo="S20261100001"
        onBack={() => alert('뒤로 가기')}
        onSkip={() => alert('건너뛰기')}
        onComplete={() => alert('입점 서류 및 자격 등록 완료!')}
      />
    );
  </script>
</body>
</html>
