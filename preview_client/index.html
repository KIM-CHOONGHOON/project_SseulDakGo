<body class="bg-slate-100 h-screen flex flex-col overflow-hidden text-slate-800">

          <button id="devTablet" onclick="setDevice('768px')" class="device-btn px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1 text-slate-600 hover:text-slate-900">
            <span class="material-symbols-outlined text-[16px]">tablet</span>

          <button id="devMobile" onclick="setDevice('390px')" class="device-btn px-3 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1 text-slate-600 hover:text-slate-900">

          <span>단독 새 탭 열기</span>
          <span class="material-symbols-outlined text-[14px]">open_in_new</span>

    <!-- 하단 탭 버튼 목록 (9개 화면) -->
    <div class="px-6 py-2 bg-slate-50/80 border-t border-slate-200/60 overflow-x-auto flex items-center gap-2 scrollbar-none">
      
        <button
          onclick="loadScreen('WEB-CLNT-COM-010000', this)"
          class="screen-tab active px-3.5 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition-all shrink-0 flex items-center gap-1.5"
          title="고객 메인 홈"
        >
          <span class="text-[11px] font-mono font-bold opacity-70">COM-010000</span>
          <span>고객</span>
          
        </button>
      
        <button
          onclick="loadScreen('WEB-CLNT-REQ-010100', this)"
          class="screen-tab bg-white text-slate-600 hover:bg-slate-100 px-3.5 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition-all shrink-0 flex items-center gap-1.5"
          title="청소 서비스 신청 (발주서 작성)"
        >
          <span class="text-[11px] font-mono font-bold opacity-70">REQ-010100</span>
          <span>청소</span>
          <span class="text-[9px] px-1 py-0.2 bg-amber-100 text-amber-700 rounded font-bold">모달</span>
        </button>
      
        <button
          onclick="loadScreen('WEB-CLNT-REQ-010101', this)"
          class="screen-tab bg-white text-slate-600 hover:bg-slate-100 px-3.5 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition-all shrink-0 flex items-center gap-1.5"
          title="동일 시공 주소 확인 및 변경 안내"
        >
          <span class="text-[11px] font-mono font-bold opacity-70">REQ-010101</span>
          <span>동일</span>
          <span class="text-[9px] px-1 py-0.2 bg-amber-100 text-amber-700 rounded font-bold">모달</span>
        </button>
      
        <button
          onclick="loadScreen('WEB-CLNT-ATH-010100', this)"
          class="screen-tab bg-white text-slate-600 hover:bg-slate-100 px-3.5 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition-all shrink-0 flex items-center gap-1.5"
          title="고객 로그인"
        >
          <span class="text-[11px] font-mono font-bold opacity-70">ATH-010100</span>
          <span>고객</span>
          <span class="text-[9px] px-1 py-0.2 bg-amber-100 text-amber-700 rounded font-bold">모달</span>
        </button>
      
        <button
          onclick="loadScreen('WEB-CLNT-ATH-010200', this)"
          class="screen-tab bg-white text-slate-600 hover:bg-slate-100 px-3.5 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition-all shrink-0 flex items-center gap-1.5"
          title="통합 회원가입 및 약관동의 서명"
        >
          <span class="text-[11px] font-mono font-bold opacity-70">ATH-010200</span>
          <span>통합</span>
          <span class="text-[9px] px-1 py-0.2 bg-amber-100 text-amber-700 rounded font-bold">모달</span>
        </button>
      
        <button
          onclick="loadScreen('WEB-CLNT-ATH-010201', this)"
          class="screen-tab bg-white text-slate-600 hover:bg-slate-100 px-3.5 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition-all shrink-0 flex items-center gap-1.5"
          title="고객 가입 완료 환영 안내"
        >
          <span class="text-[11px] font-mono font-bold opacity-70">ATH-010201</span>
          <span>고객</span>
          <span class="text-[9px] px-1 py-0.2 bg-amber-100 text-amber-700 rounded font-bold">모달</span>
        </button>
      
        <button
          onclick="loadScreen('WEB-CLNT-ORD-010000', this)"
          class="screen-tab bg-white text-slate-600 hover:bg-slate-100 px-3.5 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition-all shrink-0 flex items-center gap-1.5"
          title="나의 청소 신청 현황"
        >
          <span class="text-[11px] font-mono font-bold opacity-70">ORD-010000</span>
          <span>나의</span>
          
        </button>
      
        <button
          onclick="loadScreen('WEB-CLNT-ORD-010100', this)"
          class="screen-tab bg-white text-slate-600 hover:bg-slate-100 px-3.5 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition-all shrink-0 flex items-center gap-1.5"
          title="청소 요청 상세 및 청약서 비교/선택"
        >

          <span>청소</span>
          
        </button>
      
        <button
          onclick="loadScreen('WEB-CLNT-PAY-010100', this)"
          class="screen-tab bg-white text-slate-600 hover:bg-slate-100 px-3.5 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition-all shrink-0 flex items-center gap-1.5"
          title="고객 데이터 이용료 결제 및 계약 확정"
        >
          <span class="text-[11px] font-mono font-bold opacity-70">PAY-010100</span>
          <span>고객</span>
          <span class="text-[9px] px-1 py-0.2 bg-amber-100 text-amber-700 rounded font-bold">모달</span>
        </button>
      
        <button
          onclick="loadScreen('WEB-CLNT-JOB-010100', this)"
          class="screen-tab bg-white text-slate-600 hover:bg-slate-100 px-3.5 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition-all shrink-0 flex items-center gap-1.5"
          title="청소 시공 검수 및 현장 직불 완료 승인"
        >
          <span class="text-[11px] font-mono font-bold opacity-70">JOB-010100</span>
          <span>청소</span>
          
        </button>
      
    </div>
  </header>

  <!-- 메인 뷰포트 영역 (iframe 컨테이너) -->
  <main class="flex-1 bg-slate-200/80 p-4 flex items-center justify-center overflow-hidden">
    <div id="viewportContainer" class="w-full h-full bg-white rounded-2xl shadow-xl overflow-hidden transition-all duration-300 border border-slate-300/80 flex flex-col">
      <!-- 프레임 상단 주소 바 표시창 -->
      <div class="bg-slate-100 px-4 py-2 border-b border-slate-200 flex items-center justify-between text-xs text-slate-500">
        <div class="flex items-center gap-2">
          <div class="flex gap-1.5">
            <div class="w-2.5 h-2.5 rounded-full bg-rose-400"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-amber-400"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-400"></div>
          </div>
          <span id="currentTitle" class="font-bold text-slate-800 ml-2">고객 메인 홈</span>
          <span id="currentId" class="text-slate-400 font-mono text-[11px]">(WEB-CLNT-COM-010000)</span>
        </div>
        <div id="currentDesc" class="text-[11px] text-slate-500 truncate max-w-xl">
          3대 청소 선택 카드 및 실시간 접수 피드 표출, 청소 요청 등록 진입
        </div>
      </div>

      <!-- 메인 렌더링 iframe -->
      <iframe id="previewFrame" src="WEB-CLNT-COM-010000.html" class="w-full flex-1 border-none bg-white"></iframe>
    </div>
  </main>

  <script>
    const screensData = [{"id":"WEB-CLNT-COM-010000","title":"고객 메인 홈","category":"Main 화면","folder":"WEB-CLNT-COM-010000","mainComponent":"WebClntCom010000","isModal":false,"desc":"3대 청소 선택 카드 및 실시간 접수 피드 표출, 청소 요청 등록 진입"},{"id":"WEB-CLNT-REQ-010100","title":"청소 서비스 신청 (발주서 작성)","category":"Sub 화면 (모달)","folder":"WEB-CLNT-REQ-010100","mainComponent":"WebClntReq010100Modal","isModal":true,"desc":"3대 탭(정기/입주/가전), 현장 주소 검색, 고객 확정 지정가 입력"},{"id":"WEB-CLNT-REQ-010101","title":"동일 시공 주소 확인 및 변경 안내","category":"Sub 화면 (모달)","folder":"WEB-CLNT-REQ-010101","mainComponent":"WebClntReq010101Modal","isModal":true,"desc":"정기/입주/가전 탭 간 동일 주소 중복 감지 시 계속 등록 여부 확인 및 탭별 주소 변경 모달"},{"id":"WEB-CLNT-ATH-010100","title":"고객 로그인","category":"Sub 화면 (모달)","folder":"WEB-CLNT-ATH-010100","mainComponent":"WebClntAth010100","isModal":true,"desc":"이메일/비밀번호 로그인, 소셜 간편로그인, 임시 발주 데이터 복원"},{"id":"WEB-CLNT-ATH-010200","title":"통합 회원가입 및 약관동의 서명","category":"Sub 화면 (모달)","folder":"WEB-CLNT-ATH-010200","mainComponent":"WebClntAth010200","isModal":true,"desc":"본인확인, 4대 필수약관 100% 스크롤 동의, 자필 캔버스 전자서명"},{"id":"WEB-CLNT-ATH-010201","title":"고객 가입 완료 환영 안내","category":"Sub 화면 (모달)","folder":"WEB-CLNT-ATH-010201","mainComponent":"WebClntAth010201","isModal":true,"desc":"가입 환영 메시지 및 즉시 첫 청소 요청 신청 유도"},{"id":"WEB-CLNT-ORD-010000","title":"나의 청소 신청 현황","category":"Main 화면","folder":"WEB-CLNT-ORD-010000","mainComponent":"WebClntOrd010000","isModal":false,"desc":"발주 오더 진행 상태 라이프사이클, 7일 청약 만료 타이머 표출"},{"id":"WEB-CLNT-ORD-010100","title":"청소 요청 상세 및 청약서 비교/선택","category":"Sub 화면","folder":"WEB-CLNT-ORD-010100","mainComponent":"WebClntOrd010100","isModal":false,"desc":"접수된 파트너들의 제안 일정, 투입인원, 장비 어필 비교 후 1인 선택"},{"id":"WEB-CLNT-PAY-010100","title":"고객 데이터 이용료 결제 및 계약 확정","category":"Sub 화면 (모달)","folder":"WEB-CLNT-PAY-010100","mainComponent":"WebClntPay010100","isModal":true,"desc":"매칭 수수료(16,500원~) 전자결제 및 배타적 단일 계약 체결"},{"id":"WEB-CLNT-JOB-010100","title":"청소 시공 검수 및 현장 직불 완료 승인","category":"Sub 화면","folder":"WEB-CLNT-JOB-010100","mainComponent":"WebClntJob010100","isModal":false,"desc":"시공 전/후 사진 갤러리 열람, 작업 완료 승인 및 현장 직불 안내"}];

    function loadScreen(screenId, btnEl) {
      // 1. 활성 탭 스타일 전환
      document.querySelectorAll('.screen-tab').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');

      // 2. iframe 주소 변경
      const frame = document.getElementById('previewFrame');
      frame.src = screenId + '.html';

      // 3. 새 탭 열기 링크 동기화
      document.getElementById('btnNewTab').href = screenId + '.html';

      // 4. 정보 텍스트 갱신
      const info = screensData.find(s => s.id === screenId);
      if (info) {
        document.getElementById('currentTitle').innerText = info.title;
        document.getElementById('currentId').innerText = '(' + info.id + ')';
        document.getElementById('currentDesc').innerText = info.desc;
      }
    }

    function setDevice(width) {
      const container = document.getElementById('viewportContainer');
      container.style.width = width;
      if (width === '100%') {
        container.style.maxWidth = '100%';
      } else {
        container.style.maxWidth = width;
      }

      // 버튼 토글
      document.querySelectorAll('.device-btn').forEach(b => {
        b.classList.remove('active', 'bg-[#0F172A]', 'text-white');
        b.classList.add('text-slate-600');
      });
      event.currentTarget.classList.add('active', 'bg-[#0F172A]', 'text-white');
      event.currentTarget.classList.remove('text-slate-600');
    }
  </script>
</body>
</html>
