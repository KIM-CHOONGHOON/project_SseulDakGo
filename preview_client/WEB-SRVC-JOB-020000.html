<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>[WEB-SRVC-JOB-020000] 시공 파트너 현장 진행 현황 - 쓸고닦고</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link
    href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#003d9b",
            navy: "#1F497D",
            teal: "#006a61",
            action: "#006a61",
            alert: "#ba1a1a",
            warning: "#F59E0B",
            success: "#10B981"
          },
          fontFamily: {
            sans: ["Pretendard", "Inter", "-apple-system", "sans-serif"]
          }
        }
      }
    };
  </script>

  <!-- React 18 & Babel -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-[#f7f9fb] antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function WebSrvcJob020100Modal({ isOpen, onClose, jobData, onSuccess }) {
      const [activeTab, setActiveTab] = useState('ING');
      const [photos, setPhotos] = useState([
        { id: 1, phase: 'BEFORE', url: 'https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=400&auto=format&fit=crop&q=80', caption: '시공 전 상가 복도 바닥 찌든때', isRep: true },
        { id: 2, phase: 'BEFORE', url: 'https://images.unsplash.com/photo-1527515637462-cff94eecc1ac?w=400&auto=format&fit=crop&q=80', caption: '시공 전 계단실 난간 분진', isRep: false },
        { id: 3, phase: 'ING', url: 'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400&auto=format&fit=crop&q=80', caption: '고압 세척 및 바닥 박리 작업 중', isRep: false },
        { id: 4, phase: 'ING', url: 'https://images.unsplash.com/photo-1628177142898-93e36e4e3a50?w=400&auto=format&fit=crop&q=80', caption: '2층 복도 친환경 왁싱 코팅 중', isRep: false },
      ]);
      const [isSubmitting, setIsSubmitting] = useState(false);

      if (!isOpen) return null;

      const currentTabPhotos = photos.filter(p => p.phase === activeTab);

      const handleAddPhoto = () => {
        if (photos.length >= 20) {
          alert('최대 20장까지만 첨부할 수 있습니다.');
          return;
        }
        const sampleUrls = [
          'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400&auto=format&fit=crop&q=80',
          'https://images.unsplash.com/photo-1628177142898-93e36e4e3a50?w=400&auto=format&fit=crop&q=80',
          'https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=400&auto=format&fit=crop&q=80'
        ];
        const newPhoto = {
          id: Date.now(),
          phase: activeTab,
          url: sampleUrls[Math.floor(Math.random() * sampleUrls.length)],
          caption: `${activeTab === 'BEFORE' ? '시공 전' : activeTab === 'ING' ? '시공 중' : '시공 후'} 현장 확인 사진`,
          isRep: photos.length === 0
        };
        setPhotos([...photos, newPhoto]);
      };

      const handleDelete = (id) => setPhotos(photos.filter(p => p.id !== id));
      const handleRep = (id) => setPhotos(photos.map(p => ({ ...p, isRep: p.id === id })));

      const handleSubmit = () => {
        setIsSubmitting(true);
        setTimeout(() => {
          setIsSubmitting(false);
          alert('시공 사진이 안전하게 등록되었습니다.');
          if (onSuccess) onSuccess(photos.length);
          onClose();
        }, 500);
      };

      return (
        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
          <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden border border-slate-200">
            <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
              <div className="flex items-center gap-2">
                <span className="p-1.5 rounded-lg bg-emerald-50 text-[#006a61] flex items-center justify-center">
                  <span className="material-symbols-outlined text-[20px]">photo_camera</span>
                </span>
                <div>
                  <h3 className="font-extrabold text-base text-slate-900">현장 시공 사진 첨부 [WEB-SRVC-JOB-020100]</h3>
                  <p className="text-xs text-slate-500">주문번호: {jobData?.orderNo || 'SDG-2026-1120'} · 고객: {jobData?.clientName || '김충훈'} 님</p>
                </div>
              </div>
              <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-slate-200 flex items-center justify-center text-slate-400 hover:text-slate-600">
                <span className="material-symbols-outlined text-[20px]">close</span>
              </button>
            </div>

            <div className="px-6 pt-3 border-b border-slate-100 flex gap-2 bg-white">
              <button
                onClick={() => setActiveTab('BEFORE')}
                className={`pb-2.5 px-3 text-xs font-bold border-b-2 transition-all flex items-center gap-1.5 ${activeTab === 'BEFORE' ? 'border-[#006a61] text-[#006a61]' : 'border-transparent text-slate-400'}`}
              >
                <span>시공 전 (Before)</span>
                <span className="px-1.5 py-0.2 rounded-full text-[10px] bg-slate-100 text-slate-600">{photos.filter(p => p.phase === 'BEFORE').length}</span>
              </button>
              <button
                onClick={() => setActiveTab('ING')}
                className={`pb-2.5 px-3 text-xs font-bold border-b-2 transition-all flex items-center gap-1.5 ${activeTab === 'ING' ? 'border-[#006a61] text-[#006a61]' : 'border-transparent text-slate-400'}`}
              >
                <span>시공 중 (Ing)</span>
                <span className="px-1.5 py-0.2 rounded-full text-[10px] bg-emerald-100 text-[#006a61] font-bold">{photos.filter(p => p.phase === 'ING').length}</span>
              </button>
              <button
                onClick={() => setActiveTab('AFTER')}
                className={`pb-2.5 px-3 text-xs font-bold border-b-2 transition-all flex items-center gap-1.5 ${activeTab === 'AFTER' ? 'border-[#006a61] text-[#006a61]' : 'border-transparent text-slate-400'}`}
              >
                <span>시공 후 (After)</span>
                <span className="px-1.5 py-0.2 rounded-full text-[10px] bg-slate-100 text-slate-600">{photos.filter(p => p.phase === 'AFTER').length}</span>
              </button>
            </div>

            <div className="p-6 overflow-y-auto space-y-4 flex-1">
              <div
                onClick={handleAddPhoto}
                className="border-2 border-dashed border-emerald-300 bg-emerald-50/40 rounded-xl p-5 text-center cursor-pointer hover:bg-emerald-50 transition-colors flex flex-col items-center justify-center gap-1"
              >
                <span className="material-symbols-outlined text-[28px] text-[#006a61]">add_photo_alternate</span>
                <p className="text-xs font-bold text-slate-700 mt-1">현장 사진 추가 / 카메라 촬영 등록</p>
                <p className="text-[11px] text-slate-500">클릭하여 사진을 추가합니다 (최대 20장, 장당 15MB 제한)</p>
              </div>

              <div>
                <div className="flex items-center justify-between text-xs font-bold text-slate-600 mb-2">
                  <span>{activeTab === 'BEFORE' ? '시공 전' : activeTab === 'ING' ? '시공 중' : '시공 후'} 등록 사진</span>
                  <span className="text-[11px] font-normal text-slate-400">총 {photos.length}장 등록됨 / 최대 20장</span>
                </div>
                {currentTabPhotos.length === 0 ? (
                  <div className="py-8 text-center text-xs text-slate-400 bg-slate-50 rounded-xl">
                    등록된 사진이 없습니다. 상단 영역을 클릭해 사진을 등록해주세요.
                  </div>
                ) : (
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {currentTabPhotos.map((photo) => (
                      <div key={photo.id} className="relative group rounded-xl overflow-hidden border border-slate-200 bg-slate-100 shadow-xs flex flex-col">
                        <div className="h-28 w-full overflow-hidden relative">
                          <img src={photo.url} alt={photo.caption} className="w-full h-full object-cover group-hover:scale-105 transition-transform" />
                          {photo.isRep && (
                            <span className="absolute top-2 left-2 px-2 py-0.5 rounded-md bg-[#006a61] text-white text-[10px] font-bold">
                              대표사진
                            </span>
                          )}
                          <button
                            type="button"
                            onClick={() => handleDelete(photo.id)}
                            className="absolute top-2 right-2 w-6 h-6 rounded-full bg-black/60 text-white flex items-center justify-center hover:bg-red-600"
                          >
                            <span className="material-symbols-outlined text-[14px]">delete</span>
                          </button>
                        </div>
                        <div className="p-2 bg-white flex flex-col gap-1">
                          <p className="text-[11px] text-slate-700 line-clamp-1 font-medium">{photo.caption}</p>
                          <button
                            type="button"
                            onClick={() => handleRep(photo.id)}
                            className={`text-[10px] font-bold text-left ${photo.isRep ? 'text-[#006a61]' : 'text-slate-400 hover:text-slate-700'}`}
                          >
                            {photo.isRep ? '✓ 대표사진 지정됨' : '대표사진으로 지정'}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div className="px-6 py-3.5 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
              <span className="text-xs font-medium text-slate-500">
                전체: <strong className="text-slate-900 font-bold">{photos.length}</strong>장 업로드됨
              </span>
              <div className="flex items-center gap-2">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-200">
                  닫기
                </button>
                <button
                  type="button"
                  disabled={isSubmitting}
                  onClick={handleSubmit}
                  className="px-5 py-2 rounded-xl text-xs font-bold bg-[#006a61] hover:bg-[#004f48] text-white shadow-xs flex items-center gap-1.5"
                >
                  <span className="material-symbols-outlined text-[16px]">cloud_upload</span>
                  <span>{isSubmitting ? '저장 중...' : '사진 등록 완료'}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function WebSrvcJob020200Modal({ isOpen, onClose, jobData, onSuccess }) {
      const [checklists, setChecklists] = useState([
        { id: 1, text: '상가 1~2층 복도 및 계단실 바닥 먼지 흡입 및 왁싱 건조 완료', checked: true },
        { id: 2, text: '남녀 화장실 2개소 고온 스팀 살균 및 위생 소모품 교체', checked: true },
        { id: 3, text: '1층 로비 출입문 유리창 지문 제거 및 피톤치드 분무 소독', checked: true },
        { id: 4, text: '수거된 재활용 쓰레기 규격 봉투 분리 배출 완료', checked: true },
      ]);
      const [notes, setNotes] = useState('상가 1~2층 복도 왁싱 건조 작업 완료되었습니다. 화장실 소독 및 쓰레기 분리수거 완료했습니다.');
      const [sendPush, setSendPush] = useState(true);
      const [isSubmitting, setIsSubmitting] = useState(false);

      if (!isOpen) return null;

      const toggleCheck = (id) => {
        setChecklists(checklists.map(c => c.id === id ? { ...c, checked: !c.checked } : c));
      };

      const isAllChecked = checklists.every(c => c.checked);

      const handleSubmit = () => {
        if (!isAllChecked) {
          alert('모든 필수 시공 완료 체크리스트를 확인해 주세요.');
          return;
        }
        setIsSubmitting(true);
        setTimeout(() => {
          setIsSubmitting(false);
          alert('현장 시공 완료 등록이 완료되었으며, 고객님께 검수 요청 알림이 발송되었습니다.');
          if (onSuccess) onSuccess();
          onClose();
        }, 500);
      };

      return (
        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
          <div className="bg-white rounded-2xl shadow-2xl max-w-xl w-full max-h-[90vh] flex flex-col overflow-hidden border border-slate-200">
            <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
              <div className="flex items-center gap-2">
                <span className="p-1.5 rounded-lg bg-blue-50 text-[#003d9b] flex items-center justify-center">
                  <span className="material-symbols-outlined text-[20px]">task_alt</span>
                </span>
                <div>
                  <h3 className="font-extrabold text-base text-slate-900">현장 시공 완료 등록 [WEB-SRVC-JOB-020200]</h3>
                  <p className="text-xs text-slate-500">주문번호: {jobData?.orderNo || 'SDG-2026-1120'}</p>
                </div>
              </div>
              <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-slate-200 flex items-center justify-center text-slate-400 hover:text-slate-600">
                <span className="material-symbols-outlined text-[20px]">close</span>
              </button>
            </div>

            <div className="p-6 overflow-y-auto space-y-5 flex-1">
              <div className="bg-slate-50 p-4 rounded-xl border border-slate-200/80 space-y-1.5 text-xs">
                <div className="flex justify-between items-center text-slate-600">
                  <span>발주고객</span>
                  <strong className="text-slate-900 font-bold">{jobData?.clientName || '김충훈'} 님 (안심번호 0504)</strong>
                </div>
                <div className="flex justify-between items-center text-slate-600">
                  <span>현장주소</span>
                  <span className="text-slate-800 font-medium text-right line-clamp-1">{jobData?.siteAddress || '경기 고양시 일산동구 백석동 120-1'}</span>
                </div>
                <div className="flex justify-between items-center text-slate-600">
                  <span>시공담당</span>
                  <span className="text-[#006a61] font-bold">{jobData?.contractor?.companyName || '공간다원 시공팀'} ({jobData?.contractor?.managerName || '김태호 팀장'})</span>
                </div>
              </div>

              <div>
                <div className="flex items-center justify-between mb-2">
                  <label className="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                    <span className="material-symbols-outlined text-[16px] text-[#003d9b]">checklist</span>
                    시공 완료 4대 필수 체크리스트
                  </label>
                  <span className={`text-[11px] font-bold ${isAllChecked ? 'text-[#006a61]' : 'text-amber-600'}`}>
                    {checklists.filter(c => c.checked).length} / {checklists.length} 확인됨
                  </span>
                </div>
                <div className="space-y-2 bg-slate-50/70 p-3.5 rounded-xl border border-slate-200/80">
                  {checklists.map((item) => (
                    <label key={item.id} className="flex items-start gap-2.5 p-2 rounded-lg hover:bg-white transition-colors cursor-pointer text-xs">
                      <input
                        type="checkbox"
                        checked={item.checked}
                        onChange={() => toggleCheck(item.id)}
                        className="mt-0.5 rounded text-[#003d9b] focus:ring-[#003d9b] cursor-pointer"
                      />
                      <span className={`${item.checked ? 'text-slate-800 font-medium' : 'text-slate-400'}`}>
                        {item.text}
                      </span>
                    </label>
                  ))}
                </div>
              </div>

              <div>
                <label className="text-xs font-bold text-slate-800 block mb-1.5">
                  인수인계 및 특이사항 메모 (고객 전달)
                </label>
                <textarea
                  rows={3}
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="고객님께 전달할 현장 특이사항이나 관리 팁을 작성하세요."
                  className="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-[#003d9b]/20 focus:border-[#003d9b]"
                />
              </div>

              <div className="bg-blue-50/70 p-3.5 rounded-xl border border-blue-200/80 flex items-center gap-2.5">
                <input
                  type="checkbox"
                  id="sendPushCheck"
                  checked={sendPush}
                  onChange={(e) => setSendPush(e.target.checked)}
                  className="rounded text-[#003d9b] focus:ring-[#003d9b] cursor-pointer"
                />
                <label htmlFor="sendPushCheck" className="text-xs text-slate-700 cursor-pointer">
                  등록 즉시 고객님({jobData?.clientName || '김충훈'} 님)께 <strong>현장 최종검수 및 서명 요청 알림톡(Push/SMS)</strong>을 발송합니다.
                </label>
              </div>
            </div>

            <div className="px-6 py-3.5 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2">
              <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-200">
                취소
              </button>
              <button
                type="button"
                disabled={isSubmitting || !isAllChecked}
                onClick={handleSubmit}
                className={`px-5 py-2 rounded-xl text-xs font-bold text-white shadow-xs flex items-center gap-1.5 ${isAllChecked ? 'bg-[#003d9b] hover:bg-[#002b6e] cursor-pointer' : 'bg-slate-300 cursor-not-allowed'}`}
              >
                <span className="material-symbols-outlined text-[16px]">check_circle</span>
                <span>{isSubmitting ? '처리 중...' : '최종 시공완료 등록'}</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    function WebSrvcJob020000Dashboard() {
      const [jobData, setJobData] = useState({
        orderNo: 'SDG-2026-1120',
        contractNo: 'CNT-2026-112001',
        clientName: '김충훈',
        clientSafePhone: '0504-1234-5678',
        siteAddress: '경기 고양시 일산동구 백석동 120-1 (백석 상가빌딩 1~2층)',
        serviceType: '강남구 역삼동 아펠가모 34평 프리미엄 입주청소 + 피톤치드 살균',
        orderDate: '2026-11-20 14:00',
        progressStep: 3,
        progressRate: 72,
        contractor: {
          companyName: '공간다원 시공팀',
          managerName: '김태호 팀장',
          license: '1급 위생관리사',
          rating: 4.98,
          profileImg: 'https://images.unsplash.com/photo-1540569014015-19a7be504e3a?w=150&auto=format&fit=crop&q=80'
        },
        photos: {
          beforeCount: 4,
          ingCount: 4,
          afterCount: 0,
          totalCount: 8
        }
      });

      const [isPhotoModalOpen, setIsPhotoModalOpen] = useState(false);
      const [isCompleteModalOpen, setIsCompleteModalOpen] = useState(false);

      return (
        <div className="bg-[#f7f9fb] text-[#191c1e] min-h-screen flex flex-col font-sans antialiased">
          {/* GNB Header */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md shadow-xs border-b border-slate-200/80">
            <div className="max-w-[1440px] mx-auto px-6 sm:px-8 h-18 flex items-center justify-between gap-4">
              <div className="flex items-center gap-6">
                <a href="/" className="flex items-center gap-2 cursor-pointer select-none">
                  <div className="w-9 h-9 rounded-xl bg-[#003d9b] flex items-center justify-center text-white font-extrabold text-sm shadow-xs">
                    SDG
                  </div>
                  <div className="flex flex-col">
                    <span className="text-lg font-extrabold text-[#003d9b] tracking-tight leading-none">쓸고닦고</span>
                    <span className="text-[9px] font-bold text-slate-400 tracking-wider">BUILDING CLEANING</span>
                  </div>
                </a>

                <nav className="hidden xl:flex items-center gap-1 bg-slate-100/80 p-1 rounded-full border border-slate-200/60 text-xs">
                  <a href="/" className="px-3.5 py-1.5 rounded-full font-medium text-slate-700 hover:text-slate-900 hover:bg-white transition-all">
                    청소·시공 청약
                  </a>
                  <a href="/preview/job_020000" className="px-3.5 py-1.5 rounded-full font-bold bg-[#003d9b] text-white shadow-xs">
                    현장 진행 현황
                  </a>
                  <a href="#" onClick={() => alert('시공 완료 건에 대한 고객 만족도 및 후기 답글 작성 화면으로 이동합니다.')} className="px-3.5 py-1.5 rounded-full font-medium text-slate-700 hover:text-slate-900 hover:bg-white transition-all">
                    이용후기 답글 쓰기
                  </a>
                  <a href="/preview/myp_010100" className="px-3.5 py-1.5 rounded-full font-medium text-slate-700 hover:text-slate-900 hover:bg-white transition-all">
                    내 정보
                  </a>
                  <a href="#" onClick={() => alert('쓸고닦고 고객만족센터: 1588-7824')} className="px-3.5 py-1.5 rounded-full font-medium text-slate-700 hover:text-slate-900 hover:bg-white transition-all">
                    고객센터
                  </a>
                </nav>
              </div>

              <div className="flex items-center gap-3">
                <span className="text-xs font-bold text-slate-800">
                  공간다원 님
                  <span className="ml-1 text-[10px] px-1.5 py-0.2 rounded-full bg-emerald-100 text-[#006a61]">
                    인증 시공사 (S)
                  </span>
                </span>
                <a href="/" className="text-xs text-slate-400 hover:text-slate-700">홈으로</a>
              </div>
            </div>
          </header>

          {/* Main Dashboard */}
          <main className="w-full flex-1 py-8">
            <div className="w-full max-w-[1440px] mx-auto px-6 sm:px-8 flex flex-col gap-6">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div className="flex flex-col gap-1.5">
                  <div className="flex items-center gap-2 text-xs text-slate-500 font-medium">
                    <a href="/" className="hover:text-[#003d9b]">홈</a>
                    <span>&gt;</span>
                    <span className="text-slate-900 font-bold">시공 파트너 현장 진행 현황 [WEB-SRVC-JOB-020000]</span>
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-3">
                    <span>현장 진행 현황</span>
                    <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-[#006a61]">
                      실시간 관제 중 (D-Day 14:00 예약)
                    </span>
                  </h1>
                </div>

                <div className="flex items-center gap-2 text-xs text-slate-500">
                  <span>주문번호:</span>
                  <strong className="font-mono text-slate-900 font-bold">{jobData.orderNo}</strong>
                </div>
              </div>

              {/* 핵심 현장 카드 */}
              <div className="w-full bg-white rounded-2xl shadow-sm border border-slate-200/90 p-6 sm:p-8 flex flex-col gap-6">
                {/* 1. 발주고객 성명 & 현장 주소 */}
                <div className="flex flex-col gap-1.5 pb-4 border-b border-slate-100">
                  <span className="text-lg sm:text-xl font-extrabold text-[#003d9b]">
                    {jobData.serviceType}
                  </span>
                  <div className="flex flex-wrap items-center gap-4 text-xs text-slate-600 mt-1">
                    <div>
                      발주고객: <strong className="text-slate-900 font-bold">{jobData.clientName} 님</strong>
                      <span className="ml-1.5 inline-flex items-center gap-1 text-[#006a61] font-semibold bg-emerald-50 px-2 py-0.5 rounded-full text-[11px]">
                        <span className="material-symbols-outlined text-[13px]">phone_in_talk</span>
                        안심번호 0504 연결 상태 ({jobData.clientSafePhone})
                      </span>
                    </div>
                    <span className="text-slate-300">|</span>
                    <div className="flex items-center gap-1">
                      <span className="material-symbols-outlined text-[15px] text-slate-400">location_on</span>
                      현장주소: <strong className="text-slate-800 font-bold">{jobData.siteAddress}</strong>
                    </div>
                  </div>
                </div>

                {/* 2. 5단계 시각화 Stepper */}
                <div className="w-full bg-slate-50 p-5 sm:p-6 rounded-2xl border border-slate-200/80">
                  <div className="flex items-center justify-between text-center relative">
                    <div className="flex-1 flex flex-col items-center z-10">
                      <div className="w-9 h-9 rounded-full bg-[#006a61] text-white flex items-center justify-center font-bold text-xs shadow-xs">
                        <span className="material-symbols-outlined text-[18px]">check</span>
                      </div>
                      <span className="text-xs font-bold text-slate-800 mt-2">예약 확정</span>
                      <span className="text-[11px] text-slate-400">10:00 완료</span>
                    </div>

                    <div className="flex-1 flex flex-col items-center z-10">
                      <div className="w-9 h-9 rounded-full bg-[#006a61] text-white flex items-center justify-center font-bold text-xs shadow-xs">
                        <span className="material-symbols-outlined text-[18px]">check</span>
                      </div>
                      <span className="text-xs font-bold text-slate-800 mt-2">현장 도착</span>
                      <span className="text-[11px] text-slate-400">13:45 체크</span>
                    </div>

                    <div className="flex-1 flex flex-col items-center z-10">
                      <div className="w-10 h-10 rounded-full bg-[#003d9b] text-white ring-4 ring-blue-100 flex items-center justify-center font-bold text-xs shadow-md animate-pulse">
                        <span className="material-symbols-outlined text-[20px]">cleaning_services</span>
                      </div>
                      <span className="text-xs font-extrabold text-[#003d9b] mt-2">시공 진행중</span>
                      <span className="text-[11px] font-bold text-[#006a61]">현재 {jobData.progressRate}% 진행</span>
                    </div>

                    <div className="flex-1 flex flex-col items-center z-10">
                      <div className="w-9 h-9 rounded-full bg-slate-200 text-slate-400 flex items-center justify-center font-bold text-xs">
                        4
                      </div>
                      <span className="text-xs font-medium text-slate-400 mt-2">현장 최종검수</span>
                      <span className="text-[11px] text-slate-400">17:00 예정</span>
                    </div>

                    <div className="flex-1 flex flex-col items-center z-10">
                      <div className="w-9 h-9 rounded-full bg-slate-200 text-slate-400 flex items-center justify-center font-bold text-xs">
                        5
                      </div>
                      <span className="text-xs font-medium text-slate-400 mt-2">서명 및 완료</span>
                      <span className="text-[11px] text-slate-400">안심정산</span>
                    </div>

                    <div className="absolute top-4.5 left-[10%] right-[10%] h-0.5 bg-slate-200 -z-0">
                      <div className="h-full bg-[#006a61]" style={{ width: '55%' }}></div>
                    </div>
                  </div>
                </div>

                {/* 3. 시공사 담당자 성명 & 우측 2개 제어 버튼 [시공사진첨부], [시공완료 등록] */}
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 p-5 bg-emerald-50/50 rounded-2xl border border-emerald-200/80">
                  <div className="flex items-center gap-3.5">
                    <div className="w-12 h-12 rounded-full overflow-hidden bg-slate-200 border-2 border-white shadow-xs shrink-0">
                      <img src={jobData.contractor.profileImg} alt="담당자" className="w-full h-full object-cover" />
                    </div>
                    <div className="flex flex-col">
                      <div className="flex items-center gap-2">
                        <span className="text-sm font-extrabold text-slate-900">{jobData.contractor.companyName}</span>
                        <span className="text-xs font-bold text-slate-700">(담당: {jobData.contractor.managerName})</span>
                      </div>
                      <div className="flex items-center gap-2 text-xs text-slate-600 mt-0.5">
                        <span className="text-[#006a61] font-bold">{jobData.contractor.license}</span>
                        <span className="text-slate-300">·</span>
                        <span className="flex items-center gap-0.5 text-amber-600 font-bold">
                          <span className="material-symbols-outlined text-[14px]">star</span>
                          평점 {jobData.contractor.rating}
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* 시공사 담당자 우측 버튼 배치 */}
                  <div className="flex items-center gap-3 shrink-0">
                    <button
                      type="button"
                      onClick={() => setIsPhotoModalOpen(true)}
                      className="px-5 py-2.5 rounded-xl bg-[#006a61] hover:bg-[#004f48] text-white text-xs font-extrabold shadow-sm transition-all flex items-center gap-2 cursor-pointer active:scale-95"
                    >
                      <span className="material-symbols-outlined text-[18px]">photo_camera</span>
                      <span>시공사진첨부</span>
                      <span className="px-1.5 py-0.2 rounded-full bg-white/20 text-[10px] font-mono">
                        {jobData.photos.totalCount}장
                      </span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setIsCompleteModalOpen(true)}
                      className="px-5 py-2.5 rounded-xl bg-[#003d9b] hover:bg-[#002b6e] text-white text-xs font-extrabold shadow-sm transition-all flex items-center gap-2 cursor-pointer active:scale-95"
                    >
                      <span className="material-symbols-outlined text-[18px]">check_circle</span>
                      <span>시공완료 등록</span>
                    </button>
                  </div>
                </div>

                {/* 4. 보조 액션 그리드 */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                  <div
                    onClick={() => setIsPhotoModalOpen(true)}
                    className="p-4 rounded-xl border border-slate-200 hover:border-[#006a61] bg-white transition-all cursor-pointer flex items-center justify-between group"
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-lg bg-emerald-50 text-[#006a61] flex items-center justify-center">
                        <span className="material-symbols-outlined text-[22px]">photo_library</span>
                      </div>
                      <div>
                        <h4 className="text-xs font-bold text-slate-800">실시간 등록 시공 사진 ({jobData.photos.totalCount}장)</h4>
                        <p className="text-[11px] text-slate-500">시공 전 {jobData.photos.beforeCount}장 · 시공 중 {jobData.photos.ingCount}장 등록 완료</p>
                      </div>
                    </div>
                    <span className="material-symbols-outlined text-[18px] text-slate-400 group-hover:translate-x-1 transition-transform">
                      arrow_forward
                    </span>
                  </div>

                  <div
                    onClick={() => alert(`발주고객님(${jobData.clientName} 님)과의 1:1 안심 채팅창을 연결합니다.`)}
                    className="p-4 rounded-xl border border-slate-200 hover:border-[#003d9b] bg-white transition-all cursor-pointer flex items-center justify-between group"
                  >
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-lg bg-blue-50 text-[#003d9b] flex items-center justify-center">
                        <span className="material-symbols-outlined text-[22px]">chat</span>
                      </div>
                      <div>
                        <h4 className="text-xs font-bold text-slate-800">고객님과 1:1 안심 채팅</h4>
                        <p className="text-[11px] text-slate-500">안심번호 0504 기반 실시간 소통 채널 가동 중</p>
                      </div>
                    </div>
                    <span className="material-symbols-outlined text-[18px] text-slate-400 group-hover:translate-x-1 transition-transform">
                      arrow_forward
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </main>

          <WebSrvcJob020100Modal
            isOpen={isPhotoModalOpen}
            onClose={() => setIsPhotoModalOpen(false)}
            jobData={jobData}
            onSuccess={(count) => {
              setJobData(prev => ({ ...prev, photos: { ...prev.photos, totalCount: count } }));
            }}
          />

          <WebSrvcJob020200Modal
            isOpen={isCompleteModalOpen}
            onClose={() => setIsCompleteModalOpen(false)}
            jobData={jobData}
            onSuccess={() => {
              setJobData(prev => ({ ...prev, progressStep: 4, progressRate: 100 }));
            }}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<WebSrvcJob020000Dashboard />);
  </script>
</body>

</html>
