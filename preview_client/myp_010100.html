<body class="bg-[#f7f9fb] antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    /**
 * @file SseulDakGo_Web/Client/frontend/WEB-CLNT-MYP-010100/index.jsx
 * @description 쓸고닦고 내정보 (프로필 및 통계 대시보드) 화면 컴포넌트 (WEB-CLNT-MYP-010100)
 *              - Stitch HTML 디자인 100% 반영 (Dual Role Toggle, Bento 통계, 시공 현황, 계정/보안 관리)
 *              - 로그인한 사용자 구분(C/S)에 따른 동적 분기
 *              - "사업자등록 & 전자세금계산서 정보" 메뉴는 "시공사(S)"일 때만 노출
 *              - "사업자 인증 상태 배너"도 "시공사(S)"일 때만 노출
 *              - 서브 모달 3종(전화번호 변경, 비밀번호 변경, 사업자등록증 등록) 연동
 *
 * @param {Object} props
 * @param {Function} [props.onNavigate] - 화면 라우팅 핸들러 ((path: string) => void)
 * @param {Function} [props.onOpenPhoneModal] - 전화번호 변경 모달 호출 (WEB-CLNT-MYP-010200)
 * @param {Function} [props.onOpenPasswordModal] - 비밀번호 변경 모달 호출 (WEB-CLNT-MYP-010300)
 * @param {Function} [props.onOpenBizModal] - 사업자등록증 관리 모달 호출 (WEB-CLNT-MYP-020100)
 * @param {Function} [props.onLogout] - 로그아웃 핸들러
 * @param {Object} [props.currentUser] - 현재 로그인 사용자 세션 정보
 */
    function WebClntMyp010100({
      onNavigate,
      onOpenPhoneModal,
      onOpenPasswordModal,
      onOpenBizModal,
      onLogout,
      currentUser = {
        USER_NO: 'C20261100001',
        USER_NM: '김충훈',
        USER_ROLE_CD: 'C',
        EMAIL: 'ch.kim@sseuldakgo.com',
        PHONE: '010-8942-9114'
      }
    }) {
      // 1. 역할 뷰 상태 (client: 일반 고객 뷰, contractor: 인증 시공사 뷰)
      const isContractorUser = currentUser?.USER_ROLE_CD === 'S' || currentUser?.USER_NO?.startsWith('S');
      const [roleView, setRoleView] = useState(isContractorUser ? 'contractor' : 'client');
      const isContractor = roleView === 'contractor';

      // 2. 2단계 안심 로그인 토글 상태
      const [twoFactorAuth, setTwoFactorAuth] = useState(true);

      // 3. 토스트 알림 상태
      const [toast, setToast] = useState({ show: false, message: '' });

      // 토스트 표시 헬퍼
      const showToast = useCallback((msg) => {
        setToast({ show: true, message: msg });
        setTimeout(() => {
          setToast({ show: false, message: '' });
        }, 2500);
      }, []);

      // 4. 프로필 데이터 상태 (역할별 분기)
      const [profileData, setProfileData] = useState({
        userNo: isContractor ? 'S20261100001' : 'C20261100001',
        userName: isContractor ? '공간다원 대표 김충훈' : '김충훈',
        email: isContractor ? 'gonggandawon_corp@naver.com' : 'ch.kim@sseuldakgo.com',
        phone: isContractor ? '010-8286-3457' : '010-8942-9114',
        snsProvider: isContractor ? 'NAVER' : 'KAKAO',
        bizNo: '120-88-29401',
        bizName: '공간다원',
        bizVerifiedDt: '2026-11-15',
        points: 15000,
        ongoingCount: 2,
        completedCount: 14,
        completedAmount: '4,280,000원',
        rating: 4.9,
        ratingTotal: 28,
        perfectRatingCount: 27,
        trustRate: '99.4%'
      });

      // 알림 센터 상태 관리
      const [isNotiOpen, setIsNotiOpen] = useState(false);
      const [unreadCount, setUnreadCount] = useState(3);
      const [notiList, setNotiList] = useState([
        {
          notiId: 'NT20261100001',
          notiType: 'NEW_ORDER',
          title: '새로운 발주 요청 등록',
          content: '경기 고양시 일산동구 에어컨 분해세척 (제안가: 180,000원) 청약이 가능합니다.',
          targetUrl: '/preview_client/WEB-CLNT-ORD-010100.html?orderNo=ORD202611180001',
          isRead: 'N',
          regDt: '10분 전'
        },
        {
          notiId: 'NT20261100002',
          notiType: 'NEW_ORDER',
          title: '신규 입주 청소 청약 공고',
          content: '서울 강서구 마곡동 34평 아파트 입주청소 (제안가: 360,000원) 건이 접수되었습니다.',
          targetUrl: '/preview_client/WEB-CLNT-ORD-010100.html?orderNo=ORD202611180002',
          isRead: 'N',
          regDt: '1시간 전'
        },
        {
          notiId: 'NT20261100003',
          notiType: 'MATCHING_CONFIRMED',
          title: '시공사 서류 검증 승인 완료',
          content: '제출하신 사업자등록증 및 자격증 원본 서류 심사가 승인 완료되었습니다.',
          targetUrl: '/preview/myp_020100.html',
          isRead: 'N',
          regDt: '어제'
        }
      ]);

      // 알림 목록 조회 함수
      const fetchNotifications = async (uNo) => {
        try {
          const targetUser = uNo || profileData.userNo;
          const res = await fetch(`/api/common/notifications?userNo=${targetUser}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.success) {
              setUnreadCount(typeof data.unreadCount === 'number' ? data.unreadCount : 0);
              if (Array.isArray(data.list) && data.list.length > 0) {
                setNotiList(data.list);
              }
            }
          }
        } catch (e) {
          console.warn('알림 로드 실패 (기본값 유지):', e);
        }
      };

      // 단건 알림 읽음 처리
      const handleReadNoti = async (noti) => {
        if (noti.isRead === 'N') {
          try {
            await fetch('/api/common/notifications/read', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ notiId: noti.notiId, userNo: profileData.userNo })
            });
          } catch (e) {
            console.warn('읽음 처리 실패:', e);
          }
          setNotiList(prev => prev.map(item => item.notiId === noti.notiId ? { ...item, isRead: 'Y' } : item));
          setUnreadCount(prev => Math.max(0, prev - 1));
        }
        if (noti.targetUrl) {
          setIsNotiOpen(false);
          showToast(`'${noti.title}' 상세 화면으로 이동합니다.`);
          setTimeout(() => {
            window.location.href = noti.targetUrl;
          }, 400);
        }
      };

      // 전체 알림 모두 읽음 처리
      const handleReadAllNoti = async () => {
        try {
          await fetch('/api/common/notifications/read-all', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userNo: profileData.userNo })
          });
        } catch (e) {
          console.warn('모두 읽음 실패:', e);
        }
        setNotiList(prev => prev.map(item => ({ ...item, isRead: 'Y' })));
        setUnreadCount(0);
        showToast('모든 알림을 확인 처리하였습니다.');
      };

      // 역할 뷰 전환 핸들러
      const handleToggleRoleView = (role) => {
        setRoleView(role);
        if (role === 'contractor') {
          setProfileData((prev) => ({
            ...prev,
            userNo: currentUser?.USER_NO?.startsWith('S') ? currentUser.USER_NO : 'S20261100001',
            userName: currentUser?.USER_ROLE_CD === 'S' ? currentUser.USER_NM : '공간다원 대표 김충훈',
            email: 'gonggandawon_corp@naver.com',
            phone: '010-8286-3457',
            bizNo: '120-88-29401',
            bizName: '공간다원',
            bizVerifiedDt: '2026-11-15'
          }));
          showToast('인증 시공사(공간다원) 모드로 전환되었습니다. 사업자등록증 메뉴가 활성화됩니다.');
        } else {
          setProfileData((prev) => ({
            ...prev,
            userNo: currentUser?.USER_NO?.startsWith('C') ? currentUser.USER_NO : 'C20261100001',
            userName: currentUser?.USER_ROLE_CD === 'C' ? currentUser.USER_NM : '김충훈',
            email: 'ch.kim@sseuldakgo.com',
            phone: '010-8942-9114',
            bizNo: null,
            bizName: null,
            bizVerifiedDt: null
          }));
          showToast('일반 고객 모드로 전환되었습니다. 사업자등록증 메뉴가 숨김 처리됩니다.');
        }
      };

      // 회원번호 클립보드 복사
      const handleCopyMemberNo = () => {
        const textToCopy = profileData.userNo;
        if (navigator?.clipboard?.writeText) {
          navigator.clipboard.writeText(textToCopy).then(() => {
            showToast(`회원번호 ${textToCopy}가 클립보드에 복사되었습니다.`);
          }).catch(() => {
            showToast(`회원번호 ${textToCopy}가 복사되었습니다.`);
          });
        } else {
          showToast(`회원번호 ${textToCopy}가 복사되었습니다.`);
        }
      };

      // 로그아웃 확인
      const handleConfirmLogout = () => {
        if (window.confirm('안전하게 로그아웃 하시겠습니까?')) {
          showToast('로그아웃 처리 중입니다...');
          if (onLogout) {
            setTimeout(onLogout, 500);
          }
        }
      };

      // 회원탈퇴 안내 팝업
      const handleOpenDeleteModal = () => {
        window.alert('회원 탈퇴 시 진행 중인 공간 케어 보증 서비스 및 잔여 포인트(15,000P)가 즉시 소멸됩니다. 고객센터(1588-7824)를 통해 정산 후 진행 가능합니다.');
      };

      // 백엔드 API 연동
      useEffect(() => {
        const fetchProfile = async () => {
          try {
            const res = await fetch(`/api/web/client/myp_010100?userNo=${encodeURIComponent(profileData.userNo)}`);
            if (res.ok) {
              const json = await res.json();
              if (json.success && json.data) {
                setProfileData((prev) => ({ ...prev, ...json.data }));
              }
            }
          } catch (e) {
            // 모의 데이터 fallback 유지
          }
        };
        fetchProfile();
        fetchNotifications(profileData.userNo);
      }, [profileData.userNo]);

      return (
        <div className="bg-[#f7f9fb] text-[#191c1e] min-h-screen flex flex-col font-sans antialiased">
          {/* ─────────────────────────────────────────────────────────────
          1. Header: 내정보 관리 페이지 자체 헤더는 일체 사용하지 않으며,
             공통 GNB 네비게이션 헤더가 상단에 단일하게 적용됩니다.
      ───────────────────────────────────────────────────────────── */}

          {/* ─────────────────────────────────────────────────────────────
          2. Main Body Content
      ───────────────────────────────────────────────────────────── */}
          <main className="w-full flex-1">
            <div className="w-full max-w-[1440px] mx-auto px-6 sm:px-8 py-8 flex flex-col gap-6">

              {/* 1. Breadcrumb, Header & Dual-view Mode Switcher */}
              <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-4">
                <div className="flex flex-col gap-1.5">
                  <nav aria-label="Breadcrumb" className="flex items-center gap-2 text-slate-500 text-xs font-medium">
                    <a className="hover:text-[#003d9b] transition-colors cursor-pointer font-bold text-slate-700" onClick={() => onNavigate?.('home')}>
                      {isContractor ? '시공사 메인 홈' : '고객 메인 홈'}
                    </a>
                    <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-slate-100 text-[#006a61] text-xs font-semibold border border-slate-200">
                      <span className="material-symbols-outlined text-[14px]">location_on</span>
                      경기 고양시 일산동구
                    </span>
                    <span className="material-symbols-outlined text-[14px] text-slate-400">chevron_right</span>
                    <span className="text-slate-900 font-bold">내정보 (프로필 및 통계)</span>
                  </nav>
                  <div className="flex items-baseline gap-3 mt-1">
                    <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">내정보 관리</h1>
                  </div>
                  <p className="text-xs sm:text-sm text-slate-600">
                    {isContractor
                      ? '시공 파트너 계정 정보, 사업자등록증 정보, 수주/시공 통계, 보안 설정을 한곳에서 통합 관리합니다.'
                      : '계정 정보 확인, 시공 및 의뢰 현황 통계, 보안 설정을 한곳에서 통합 관리합니다.'}
                  </p>
                </div>


              </div>

              {/* 2. Top Profile Hero Card */}
              <div className="w-full bg-white rounded-2xl shadow-sm border border-slate-200/90 p-6 sm:p-7 flex flex-col xl:flex-row items-start xl:items-center justify-between gap-6">
                <div className="flex flex-col sm:flex-row items-start sm:items-center gap-6 w-full xl:w-auto">
                  {/* Avatar with Overlay Button */}
                  <div className="relative shrink-0">
                    <div className="w-24 h-24 rounded-full bg-slate-100 overflow-hidden shadow-inner border-2 border-slate-100 flex items-center justify-center">
                      <img
                        className="w-full h-full object-cover"
                        alt="사용자 프로필 사진"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDCMkOADy23n5QXHDwUD0JwyxwVXPvfi9NPo3eMU4B9uVvmhfnduDZarhm5tQz3UD0dgaF8cshBjnXz5ntlXbKrHHDrOHpPdZ6ZKATxDgRKoe8VtdWvJwHZURBuBf59MHRhSXUwK3FOfP-ljehF1xQpW38PlH_k6e3uS9ftjZZD5C3AIV9y6KNPlauoUj-159SfFaQQwbsSVJL-_Bi5splcd5gOfUV7JsHeEOjWSwg"
                      />
                    </div>
                    <button
                      aria-label="프로필 사진 수정"
                      onClick={() => showToast('프로필 사진 변경 창이 호출됩니다.')}
                      className="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-[#003d9b] text-white shadow-md flex items-center justify-center hover:bg-[#002b6e] transition-transform active:scale-95 cursor-pointer"
                      type="button"
                    >
                      <span className="material-symbols-outlined text-[16px]">photo_camera</span>
                    </button>
                  </div>

                  {/* Name & Badges & Metadata */}
                  <div className="flex flex-col gap-2">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">
                        {profileData.userName}
                      </span>
                      {isContractor ? (
                        <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-[#006a61] border border-emerald-200">
                          <span className="material-symbols-outlined text-[13px]">verified</span>
                          인증 시공사 (S) · 파트너
                        </span>
                      ) : (
                        <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-blue-100 text-[#003d9b] border border-blue-200">
                          <span className="material-symbols-outlined text-[13px]">auto_awesome</span>
                          일반 고객 (C)
                        </span>
                      )}
                    </div>

                    {/* Metadata Pill Badges (2단 줄바꿈 구성) */}
                    <div className="flex flex-col gap-1.5 text-slate-600 text-xs">
                      {/* Line 1: 회원번호 & 휴대전화번호 */}
                      <div className="flex flex-wrap items-center gap-2">
                        <div className="inline-flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200/80">
                          <span className="text-slate-500 font-bold uppercase text-[10px]">회원번호</span>
                          <span className="font-mono font-bold text-slate-900">{profileData.userNo}</span>
                          <button
                            className="text-slate-400 hover:text-[#003d9b] transition-colors flex items-center cursor-pointer"
                            onClick={handleCopyMemberNo}
                            title="회원번호 복사"
                            type="button"
                          >
                            <span className="material-symbols-outlined text-[14px]">content_copy</span>
                          </button>
                        </div>
                        <div className="inline-flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200/80">
                          <span className="material-symbols-outlined text-[16px] text-[#006a61]">check_circle</span>
                          <span>{profileData.phone}</span>
                          <span className="text-[11px] text-[#006a61] font-bold">(인증완료)</span>
                        </div>
                      </div>
                      {/* Line 2: 이메일 & 간편로그인 (실제 간편인증 SNS만 출력) */}
                      <div className="flex flex-wrap items-center gap-2">
                        <div className="inline-flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200/80">
                          <span className="material-symbols-outlined text-[16px] text-slate-400">mail</span>
                          <span>{profileData.email}</span>
                        </div>
                        <div className="inline-flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200/80">
                          <span className="text-slate-500 text-[10px] font-bold">간편로그인 :</span>
                          {profileData.snsProvider === 'KAKAO' ? (
                            <span className="px-2 py-0.5 rounded text-[10px] bg-[#fee500] text-[#3c1e1e] font-extrabold leading-tight">카카오</span>
                          ) : (
                            <span className="px-2 py-0.5 rounded text-[10px] bg-[#03c75a] text-white font-extrabold leading-tight">네이버</span>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Quick Action Buttons */}
                <div className="flex flex-wrap sm:flex-nowrap items-center gap-2.5 w-full xl:w-auto shrink-0 pt-2 xl:pt-0">
                  <button
                    onClick={() => showToast('프로필 사진 변경 팝업이 호출됩니다.')}
                    className="flex-1 sm:flex-initial px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200/80 text-slate-800 text-xs font-bold transition-colors flex items-center justify-center gap-1.5 border border-slate-200 shadow-xs cursor-pointer"
                    type="button"
                  >
                    <span className="material-symbols-outlined text-[18px]">image</span>
                    프로필 사진 변경
