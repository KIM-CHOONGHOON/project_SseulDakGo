    window.searchNaverAddressClient = function(query) {
      const rawTrimmed = String(query || '').trim();
      if (!rawTrimmed) return [];
      const compactQ = rawTrimmed.replace(/[\s\-_,.]+/g, '').toLowerCase();

      const poiExact = [];
      const poiPartial = [];
      for (const item of window.COMPREHENSIVE_ADDRESS_DB) {
        const compactBld = (item.bldNm || '').replace(/[\s\-_,.]+/g, '').toLowerCase();
        const compactRoad = (item.roadAddress || '').replace(/[\s\-_,.]+/g, '').toLowerCase();
        const compactJibun = (item.jibunAddress || '').replace(/[\s\-_,.]+/g, '').toLowerCase();
        if (compactBld.includes(compactQ) || compactQ.includes(compactBld)) {
          poiExact.push(item);
        } else if (compactRoad.includes(compactQ) || compactJibun.includes(compactQ)) {
          poiPartial.push(item);
        }
      }

      const tokens = rawTrimmed.toLowerCase().split(/\s+/).filter(Boolean);
      const tokenMatched = window.COMPREHENSIVE_ADDRESS_DB.filter((item) => {
        const fullText = (item.roadAddress + ' ' + (item.jibunAddress || '') + ' ' + (item.bldNm || '') + ' ' + item.dong + ' ' + item.sigungu + ' ' + item.sido).toLowerCase();
        return tokens.every((token) => fullText.includes(token)) ||
          tokens.some((token) => token.length >= 2 && (
            (item.bldNm && item.bldNm.toLowerCase().includes(token)) ||
            item.roadAddress.toLowerCase().includes(token) ||
            (item.jibunAddress && item.jibunAddress.toLowerCase().includes(token)) ||
            item.dong.toLowerCase().includes(token)
          ));
      });

      const combined = [...poiExact, ...poiPartial, ...tokenMatched];
      const seen = new Set();
      const result = [];
      for (const it of combined) {
        const key = it.roadAddress + '_' + it.bldNm;
        if (!seen.has(key)) {
          seen.add(key);
          result.push(it);
        }
      }
      return result;
    };

          statusFilter: filterValue

        setOrderList(result.data.orders || []);
        if (result.data.summary) {
          setSummary(result.data.summary);
        }

        // 초기 남은 시간(초 단위) 계산하여 timeLeftMap에 설정
        const nowMs = Date.now();
        const initialMap = {};
        (result.data.orders || []).forEach((item) => {
          if (item.orderStatus === 'BID_OPEN' && item.bidExpireDt) {
            const expMs = new Date(item.bidExpireDt).getTime();
            const diffSec = Math.max(0, Math.floor((expMs - nowMs) / 1000));
            initialMap[item.orderNo] = diffSec;
          }
        });
        setTimeLeftMap(initialMap);
      }

      console.warn('[WEB-CLNT-ORD-010000] 목록 조회 API 통신 오류 (시뮬레이션 유지):', err);

      setTimeLeftMap((prevMap) => {
        const nextMap = { ...prevMap };
        let hasExpiredTransition = false;

        Object.keys(nextMap).forEach((orderNo) => {
          if (nextMap[orderNo] > 0) {
            nextMap[orderNo] -= 1;
            // 0초에 도달한 경우
            if (nextMap[orderNo] === 0) {
              hasExpiredTransition = true;
            }
          }
        });

        // 0초 도달 시 해당 카드의 상태를 즉시 'BID_EXPIRED'(청약 만료)로 전이
        if (hasExpiredTransition) {
          setOrderList((prevList) =>
            prevList.map((order) => {
              if (order.orderStatus === 'BID_OPEN' && nextMap[order.orderNo] === 0) {
                return { ...order, orderStatus: 'BID_EXPIRED' };
              }
              return order;
            })
          );
        }

        return nextMap;
      });
    }, 1000);

    return () => clearInterval(timer);
  }, []);

      return { text: '청약 기간 마감 (BID_EXPIRED)', percent: 100, isExpired: true };
    }

    const totalSevenDaysSec = 7 * 24 * 60 * 60;

    const percent = Math.min(100, Math.max(0, Math.round((elapsedSec / totalSevenDaysSec) * 100)));

    const days = Math.floor(seconds / 86400);
    const hours = Math.floor((seconds % 86400) / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;

    const pad = (n) => String(n).padStart(2, '0');
    return {
      text: `${days}일 ${hours}시간 ${mins}분 ${pad(secs)}초`,
      percent,
